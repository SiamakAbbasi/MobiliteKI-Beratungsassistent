name: Deploy develop to VPS

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: mobility-pulse-develop-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/mobility_pulse
          chmod 600 ~/.ssh/mobility_pulse
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Configure demo authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MOBILITY_AUTH_USERNAME: ${{ secrets.MOBILITY_AUTH_USERNAME }}
          MOBILITY_AUTH_PASSWORD: ${{ secrets.MOBILITY_AUTH_PASSWORD }}
          MOBILITY_AUTH_SECRET: ${{ secrets.MOBILITY_AUTH_SECRET }}
        run: |
          test -n "$MOBILITY_AUTH_USERNAME"
          test -n "$MOBILITY_AUTH_PASSWORD"
          test "${#MOBILITY_AUTH_SECRET}" -ge 32
          {
            printf 'MOBILITY_AUTH_USERNAME=%s\n' "$MOBILITY_AUTH_USERNAME"
            printf 'MOBILITY_AUTH_PASSWORD=%s\n' "$MOBILITY_AUTH_PASSWORD"
            printf 'MOBILITY_AUTH_SECRET=%s\n' "$MOBILITY_AUTH_SECRET"
            printf 'MOBILITY_AUTH_SECURE_COOKIE=false\n'
          } | ssh -i ~/.ssh/mobility_pulse "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/mobility-pulse
            umask 077
            temporary_env=$(mktemp)
            grep -Ev "^MOBILITY_AUTH_(USERNAME|PASSWORD|SECRET|SECURE_COOKIE)=" .env > "$temporary_env" || true
            cat >> "$temporary_env"
            mv "$temporary_env" .env
          '
      - name: Configure Lina agent
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          LANGDOCK_LINA_API_KEY: ${{ secrets.LANGDOCK_LINA_API_KEY }}
          LANGDOCK_LINA_AGENT_ID: ${{ secrets.LANGDOCK_LINA_AGENT_ID }}
        run: |
          test -n "$LANGDOCK_LINA_API_KEY"
          test -n "$LANGDOCK_LINA_AGENT_ID"
          {
            printf 'LANGDOCK_LINA_API_KEY=%s\n' "$LANGDOCK_LINA_API_KEY"
            printf 'LANGDOCK_LINA_AGENT_ID=%s\n' "$LANGDOCK_LINA_AGENT_ID"
            printf 'LANGDOCK_LINA_MAX_STEPS=4\n'
          } | ssh -i ~/.ssh/mobility_pulse "$VPS_USER@$VPS_HOST" '
            set -e
            cd /opt/mobility-pulse
            umask 077
            temporary_env=$(mktemp)
            grep -Ev "^LANGDOCK_LINA_(API_KEY|AGENT_ID|MAX_STEPS)=" .env > "$temporary_env" || true
            cat >> "$temporary_env"
            mv "$temporary_env" .env
          '
      - name: Deploy develop
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mobility_pulse "$VPS_USER@$VPS_HOST" \
            'cd /opt/mobility-pulse && bash deploy/deploy.sh'

