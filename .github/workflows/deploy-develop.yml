name: Deploy develop to VPS

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: mobility-pulse-develop-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/mobility_pulse
          chmod 600 ~/.ssh/mobility_pulse
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Deploy develop
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mobility_pulse "$VPS_USER@$VPS_HOST" \
            'cd /opt/mobility-pulse && bash deploy/deploy.sh'

